<!DOCTYPE html>
<!--
  Trimmed copy of a Cinemark theatre page's showtime links, verified live on
  2026-07-29. Showtimes are plain anchors to /TicketSeatMap/ with query params,
  which is what makes seat-URL resolution possible for this chain.

  Grouped per film via a /movies/<slug> link, and a second film shares the 11:00pm
  slot on purpose: matching on time alone attributes another film's seat map to
  your showtime, which is exactly what happened on AMC's live listing.
-->
